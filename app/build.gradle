plugins { id 'com.android.application' }

android {
    namespace 'com.fortnitetracker.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.fortnitetracker.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug-signed so the APK installs directly
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
